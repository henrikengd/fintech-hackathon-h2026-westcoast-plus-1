[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "voting-assistant"
version = "0.1.0"
description = "Source-backed voting assistance for shareholder meetings"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "anthropic==2.5.0",
    "mcp==1.30.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voting_assistant"]
