<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review sheet, Tesla, Inc.</title><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><style>/* Voting Desk pages in NBIM's dark style. Inlined by sheet.dark_page, so every page stays one file. */
:root{
  /* NBIM design tokens. Fills are white over midnight, flattened so nested boxes do not stack. */
  --midnight:#001538;   /* --color-background-primary */
  --box:#0a1e40;        /* --color-fill-default #ffffff0a */
  --box2:#0f2344;       /* --color-fill-moderate #ffffff0f */
  --track:#172a4a;      /* --color-fill-strong #ffffff17 */
  --slate2:#4e5c74;     /* dark gray 2 */
  --light:#c5dfff;      /* accent blue light */
  --sea:#4ec2e2;        /* --color-brand-accent-sea */
  --gold:#f4cea4;       /* --color-ink-accent / --color-fill-accent */
  --gold2:#fcc083;      /* --color-fill-accent-moderate */
  --stroke:#ffffff3d;   /* --color-stroke-default */
  --text:#fff;          /* --color-ink-primary */
  --text2:#ffffffb3;    /* --color-ink-secondary */
}
*{box-sizing:border-box}
html,body{background:var(--midnight)}
body{margin:0;color:var(--text);font:400 17px/1.5 "Hanken Grotesk",system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-underline-offset:3px}
b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}

/* Navbar */
.topbar{border-bottom:1px solid var(--stroke)}
.topbar .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;height:88px;padding:0 24px}
.topbar .logo{height:44px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:24px}
.lang{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:16px}
.lang svg{width:20px;height:20px}
.newreport{display:inline-flex;align-items:center;gap:8px;background:var(--box);color:var(--text);border:1px solid var(--stroke);border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;text-decoration:none;white-space:nowrap}
.newreport:hover{background:var(--box2)}
.newreport svg{width:18px;height:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}

/* Heading */
header.wrap{padding-top:64px}
.eyebrow{margin:0 0 14px;font-size:14px;line-height:1;font-weight:700;letter-spacing:.035em;text-transform:uppercase;color:var(--text2)}
h1{font-size:72px;line-height:1.05;font-weight:600;letter-spacing:-1.5px;margin:0 0 16px;color:var(--gold)}
.info{display:flex;flex-wrap:wrap;list-style:none;padding:0;margin:10px 0 0;font-size:17px;line-height:1.4;row-gap:6px}
.info li{display:inline-flex;align-items:center;gap:10px;padding-right:16px}
.info li+li{padding-left:16px;border-left:1px solid var(--stroke)}
.info li.start{padding-left:0;border-left:0}
.meeting{margin:20px 0 0;font-size:20px;line-height:1.45;color:var(--gold)}
.flag{width:24px;height:18px;display:block;object-fit:cover;flex:none}

/* Overview */
.overview{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-top:48px}
.summary{background:var(--box);border:1px solid var(--stroke);padding:32px}
.total{aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.total strong{display:block;font-size:64px;line-height:1;font-weight:600;letter-spacing:-2px}
.total span{display:block;font-size:17px;margin-top:10px;white-space:nowrap}
.split{display:flex;height:14px;border-radius:14px;overflow:hidden;background:var(--track)}
.split i{display:block}
.against-c{background:var(--light)}
.unclear-c{background:var(--sea)}
.with-c{background:var(--slate2)}
.lanes{display:flex;margin-bottom:20px}
.lanes>div{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.lanes strong{display:block;font-size:48px;line-height:1;font-weight:600;letter-spacing:-1.5px}
.lanes span{display:flex;align-items:center;gap:8px;font-size:17px;margin-top:10px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Proposals */
section{margin-top:88px}
.bar-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
h2{font-size:28px;line-height:1.25;font-weight:600;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border:1px solid var(--stroke);border-radius:999px;background:var(--box)}
.seg button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500;white-space:nowrap}
.seg button:hover{background:var(--track)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--midnight)}
.seg svg{width:18px;height:18px;flex:none}
.cols,.prop summary{display:grid;grid-template-columns:40px minmax(0,1fr) 84px 92px 170px 76px 24px;gap:24px;align-items:center}
.cols{padding:0 25px 12px;font-size:15px;font-weight:600}
.prop{background:var(--box);border:1px solid var(--stroke);margin-bottom:8px}
.prop[hidden]{display:none}
.prop summary{list-style:none;cursor:pointer;padding:20px 24px}
.prop summary::-webkit-details-marker{display:none}
.prop summary:hover{background:var(--box2)}
.no{font-weight:600}
.title{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.title strong{font-weight:500;font-size:18px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border-radius:32px;padding:2px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tag.against{background:var(--light);color:var(--midnight)}
.tag.unclear{background:var(--sea);color:var(--midnight)}
.tag.with{background:var(--slate2)}
.tag.first{background:var(--track)}
.notice{margin:12px 0 0;max-width:820px}
.vote{font-weight:600;color:var(--gold)}
.conf{display:flex;align-items:center;gap:12px}
.track{flex:0 0 100px;height:10px;border-radius:10px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--sea)}
.conf span{font-size:15px}
.chev{width:24px;height:24px;transition:transform .15s}
.prop[open] .chev{transform:rotate(180deg)}
.lab{display:none}
.body{position:relative;background:var(--box);padding:8px 24px 32px 89px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:48px;align-content:start}
.body>*{grid-column:1}
.body p{margin:16px 0 0;max-width:820px}
.copy{position:absolute;top:16px;right:24px;display:flex;align-items:center;gap:8px;background:var(--track);border:0;border-radius:32px;padding:8px 14px;font-size:14px}
.copy:hover{background:var(--slate2)}
.copy svg{width:18px;height:18px}
.para{max-width:820px;margin-top:6px}
.para p{display:none;margin:12px 0 0;padding-left:18px;border-left:3px solid var(--sea)}
.para.open p{display:block}
.para p strong{font-weight:600}
.more{background:none;border:0;padding:0;margin-top:6px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.rationale{background:var(--box);border:1px solid var(--stroke);padding:20px 24px;margin-top:24px;max-width:820px}
.rationale p:first-child{margin-top:0}
.tools{display:flex;justify-content:flex-end;margin-top:16px}
.tools button,.btn{background:var(--track);border:0;border-radius:32px;padding:8px 16px;font-size:15px}
.tools button:hover,.btn:hover{background:var(--slate2)}
.btn.primary{background:var(--gold);color:var(--midnight);font-weight:600}
.btn.primary:hover{background:var(--gold2)}
.history{background:var(--box);border:1px solid var(--stroke)}
.history summary{cursor:pointer;padding:20px 24px;font-weight:600}
.history pre{margin:0;padding:0 24px 24px;white-space:pre-wrap;font:inherit;font-size:15px}

/* Sign-off, added by app.py */
input[type=text],input[type=password],textarea,select{background:var(--box);border:1px solid var(--stroke);color:var(--text);font:inherit;padding:10px 14px}
input[type=text]::placeholder,textarea::placeholder{color:var(--text2)}
input:focus,textarea:focus,select:focus{outline:2px solid #f5f2eb;outline-offset:2px}
/* The decision sits to the right of the text, under the copy button, with Log below the choice. */
/* Bottom right of the open proposal, Log under the choice. */
.body>.act{grid-column:2;grid-row:1/span 40;align-self:end;display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:64px}
.act .btn,.batch .btn{padding:10px 22px}
.logged{font-size:15px;font-weight:600;color:var(--gold)}
.prop.approved .title strong::after{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#3dd173;margin-left:10px;vertical-align:middle} /* --color-infographics-emerald */
.batch{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:-24px 0 32px}
.logbox{background:var(--midnight);color:var(--text);border:1px solid var(--stroke);padding:0;width:min(520px,calc(100vw - 32px))}
.logbox::backdrop{background:#0006}
.logbox form{display:flex;flex-direction:column;gap:16px;padding:32px;background:var(--box)}
.logbox h3{margin:0;font-size:24px;font-weight:600;color:var(--gold)}
.logbox p{margin:0}
.logbox label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.logbox label input,.logbox label textarea{font-weight:400;width:100%}
.logerror{color:var(--gold)}
.logerror:empty{display:none}
.logbuttons{display:flex;justify-content:flex-end;gap:12px;margin-top:8px}

/* Upload page */
main.wrap{padding-bottom:96px}
.lead{font-size:20px;line-height:1.45;margin:0;max-width:760px}
.upload{margin-top:48px}
.drop{display:block;background:var(--box);border:1px dashed var(--stroke);padding:72px 24px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{background:var(--box2)}
.drop strong{display:block;font-size:20px;font-weight:600}
.drop span{display:block;margin-top:4px}
.drop svg{width:36px;height:36px;margin-bottom:12px}
.upload textarea{display:block;width:100%;margin-top:16px;min-height:150px;padding:16px;resize:vertical}
#keyline{margin:20px 0 0}
#keyline input{display:block;width:100%;max-width:440px;margin-top:6px}
.agent{display:flex;gap:12px;align-items:flex-start;margin-top:20px}
.agent input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--gold);flex:none}
.go{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px}
.go .btn{padding:12px 24px}
.go button:disabled{opacity:.5;cursor:wait}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;margin-top:28px}
.tile{background:var(--box);border:1px solid var(--stroke);padding:28px;display:flex;flex-direction:column;text-decoration:none}
.tile:hover{background:var(--box2)}
.tile h3{font-size:22px;line-height:1.3;font-weight:600;margin:0}
.sub{margin:4px 0 0}
.place{display:inline-flex;align-items:center;gap:8px}
.stats{border-left:2px solid var(--text);padding-left:12px;margin:20px 0 24px}
.stats p{margin:0}
.mark{margin-top:auto;background:var(--box2);height:120px;display:grid;place-items:center;padding:16px}
.mark img{max-width:75%;max-height:64px;display:block}
.word{font-size:24px;font-weight:600;letter-spacing:1.5px;text-align:center}

@media (max-width:860px){
  .wrap{padding:0 16px}
  .topbar .bar{height:64px;padding:0 16px}
  .topbar .logo{height:32px}
  .nav{gap:12px}
  .lang span{display:none}
  .newreport{padding:8px 14px}
  .avatar{width:34px;height:34px}
  header.wrap{padding-top:40px}
  h1{font-size:44px;margin-bottom:12px}
  .info{font-size:15px}
  .meeting,.lead{font-size:17px}
  .summary{padding:20px}
  .overview{grid-template-columns:1fr}
  .total{aspect-ratio:auto}
  .total strong{font-size:44px}
  .lanes strong{font-size:36px}
  .lanes{flex-wrap:wrap;gap:20px 32px}
  .lanes>div{width:auto!important;align-items:flex-start;text-align:left}
  .lanes span{font-size:15px}
  section{margin-top:64px}
  h2{font-size:22px}
  .cols{display:none}
  .prop summary{grid-template-columns:28px minmax(0,1fr) 24px;gap:12px;padding:18px 16px}
  .prop summary .cell{grid-column:2;display:flex;gap:8px;font-size:15px}
  .lab{display:inline;font-weight:400}
  .prop summary .chev{grid-column:3;grid-row:1}
  .title strong{font-size:17px}
  .body{padding:64px 16px 24px;display:block}
  .body>.act{align-items:flex-start;margin-top:28px}
  .copy{top:16px;left:16px;right:auto}
  .batch{margin:-32px 0 24px}
  .logbox form{padding:24px}
  .drop{padding:48px 16px}
  .tiles{grid-template-columns:1fr}
}

al reporting standards and frameworks to support investors in their analysis of risks and opportunities. Where a company’s disclosure does not meet our needs as a financial investor, we will consider supporting a well-founded shareholder proposal calling for reasonable disclosure. We will not support a shareholder proposal that appears to impose a strategy or prescribe detailed methods, unrealistic timeframes or targets for implementation.", "paper": ["Corporate sustainability reporting", "https://www.nbim.no/contentassets/fc79158f623848b4b3417587ed1daede/corporate-sustainability-reporting_web.pdf"], "basis": "", "pay": "", "read_first": false}, {"item": "12", "lane": "unclear", "text": "Amend the Bylaws To Repeal 3% Derivative Suit Ownership Threshold", "board": "MOT", "vote": "FOR", "score": 53, "review": "Person", "why": "A 3% ownership threshold for derivative suits limits shareholder rights, so repealing it is in shareholders' interest. We back the proposal and vote against the board.", "section": "4.3", "quote": "We will not support changes to a company’s governing documents that are not in the best interest of shareholders.", "cited": true, "evidence": "", "check": "Exact bylaw wording and the legal basis of the threshold", "flags": "passes disagree", "rationale": "", "paper": null, "basis": "", "pay": "", "read_first": false}, {"item": "13", "lane": "unclear", "text": "Amend Bylaws", "board": "MOT", "vote": "AVSTÅ", "score": 53, "review": "Person", "why": "The item is titled only \"Amend Bylaws\" and the material gives no information on what it changes, so we cannot make an informed decision.", "section": "5.2", "quote": "We will not support an agenda item if the information disclosed is insufficient to make an informed decision, e.g. the agenda item “other business”.", "cited": true, "evidence": "", "check": "The text of the proposed bylaw amendment", "flags": "passes disagree; abstention has no published rule", "rationale": "", "paper": null, "basis": "", "pay": "", "read_first": false}, {"item": "14", "lane": "against", "text": "Declassify the Board of Directors", "board": "MOT", "vote": "FOR", "score": 53, "review": "Person", "why": "This is a proposal to declassify the board, and we backed the same proposal in 2024.", "section": "3.1", "quote": "We will support a proposal to declassify the board.", "cited": true, "evidence": "", "check": "", "flags": "", "rationale": "The company should have a robust nomination and election process to ensure an effective board that is accountable to shareholders. Shareholders should be able to participate in frequent elections of all board members, preferably on an annual basis. The company should establish reasonable procedures for shareholders to include proposals in the meeting material distributed by the company, including proposing board candidates.", "paper": ["Proxy access at US companies", "https://www.nbim.no/contentassets/cee61e4b036f45bc80d6ab888f4587ad/proxy-access-at-us-companies.pdf"], "basis": "", "pay": "", "read_first": false}, {"item": "15", "lane": "against", "text": "Reduce Supermajority Vote Requirement", "board": "MOT", "vote": "FOR", "score": 49, "review": "Person", "why": "Reducing the supermajority vote requirement weakens an anti-takeover measure, and we backed a similar proposal in 2024.", "section": "6.2", "quote": "We will support a proposal to abolish anti-takeover measures.", "cited": true, "evidence": "", "check": "", "flags": "", "rationale": "Anti-takeover measures are generally not in the interest of shareholders, and the introduction of such measures should, at a minimum, be subject to shareholder approval. We define anti-takeover measures to include any mechanism likely to deter or frustrate takeovers.", "paper": null, "basis": "", "pay": "", "read_first": false}, {"item": "16", "lane": "against", "text": "Require Shareholder Approval of Bylaw Amendments Adopted by the Board of Directors", "board": "MOT", "vote": "FOR", "score": 49, "review": "Person", "why": "Requiring shareholder approval of board-adopted bylaw amendments guards against changes to governing documents without shareholder approval, which we oppose.", "section": "3.2", "quote": "We will not support the re-election of members of the nomination or governance committee, or other board members, if the board has amended the company’s governing documents without shareholder approval.", "cited": true, "evidence": "", "check": "Exact proposal wording and any scope limits", "flags": "", "rationale": "Shareholders should have the right to seek changes to the board when it does not act in their best interest. We will consider whether the board has failed to act on material requests from shareholders, sought to circumvent shareholder proposals or implemented governance changes limiting shareholders’ rights without their approval. When voting on a proposal to discharge the board of responsibilities, we will consider whether any information raises reasonable doubt about the board’s actions. We will also take into considerations unsatisfactory financial and strategic performance, mismanaged risk-taking, unacceptable treatment of stakeholders or undesired environmental or social outcomes from company operations.", "paper": null, "basis": "", "pay": "", "read_first": false}], "sections": {"1.1": {"heading": "Independence of the board", "text": "At a large- or mid-cap company in developed markets, we will not support the election of any non-executive, non-independent director if the board does not have at least 50 percent independent members. At a large- or mid-cap, majority-controlled company in developed markets, we will not support the election of any non-executive, non-independent director if the board does not have at least one third independent members. At a company in emerging markets or at a small-cap company in developed markets, we will not support the election of the chair of the nomination committee if the board does not have at least two independent members. We will support the election of minority-nominated candidates in markets with cumulative voting."}, "1.2": {"heading": "Independence of main committees", "text": "We will not support the election of an executive director who is a member of the remuneration committee. We will not support the election of an executive director who is a member of the audit committee. We will not support the election of any non-independent director if the audit committee does not have at least 50 percent independent members."}, "1.3": {"heading": "Separation of chair and CEO", "text": "We will not support the election of a chairperson who is also the CEO of the company. We will not support an authorisation for the chairperson to serve as CEO. We will support a proposal to separate the roles of chairperson and CEO."}, "2.1": {"heading": "Time commitment", "text": "At a company in developed markets, we will not support the election of a director who sits on more than five boards, holds more than two board chairs, or otherwise has too many board or management roles to fulfil effectively his or her responsibilities at the company. We will not support the election of a director who has attended fewer than 75 percent of board meetings over the last two years."}, "2.2": {"heading": "Industry expertise", "text": "At a company in developed markets, we will not support the re-election of the chair of the nomination committee if there is not at least one non-executive director who has worked in the industry."}, "2.3": {"heading": "Diversity", "text": "In general, at a company in developed markets, we will not support the re-election of the chair of the nomination committee if the board does not include at least two members of each gender. At a company in emerging markets, we will not support the election of the chair of the nomination committee if the board does not include at least one director of each gender."}, "3.1": {"heading": "Board nomination and election", "text": "We will not support a proposal to classify (stagger) the board. We will support a proposal to declassify the board. We will not support the election of a director with an election term longer than local-market best practice. We will support a proposal to shorten the election term of a director, with our preference being one year. We will support a proposal to introduce majority requirements in director elections. We will not support the election of a director whose name has not been disclosed in the proxy information, or where the disclosure is insufficient to assess his or her suitability. We will support a proposal to eliminate cumulative voting only if the company allows for shareholder input on election of directors. We will support a proposal to introduce proxy access with holding requirements of up to three years and up to three percent ownership."}, "3.2": {"heading": "Board decisions and conduct", "text": "When voting on a proposal to discharge the board of responsibilities, we will consider whether any information raises reasonable doubt about the board’s actions. We will not support the re-election of members of the governance or nomination committee, or other directors, if the company has failed to act on material requests from shareholders where such requests received majority support the previous year. We will not support the re-election of members of the remuneration committee, or other board members, if the board received low shareholder support for its most recent pay-related proposal and we consider that the board has failed to address our concern. We will not support the re-election of members of the nomination or governance committee, or other board members, if the board has amended the company’s governing documents without shareholder approval. We will not support the re-election of a director, or the entire board, if the company has experienced material failures of governance or risk oversight, or breaches of fiduciary responsibilities. We will not support the election of a director whose service on other boards has been associated with misconduct. We will not support a proposal to discharge a director or the board of liability for their activities if there is significant concern over the board’s actions in previous years, including misstatements, material goodwill write-offs, or material legal actions against the board. We will not support the re-election of any member of the audit committee, or other board members, if the company’s financial statements received an adverse opinion from its auditor or the auditor flagged material weaknesses, and we consider that the board has failed adequately to address our concern. We will not support the re-election of a director, or the entire board, if the company has experienced material failures in the oversight, management or disclosure of environmental risks. We will not support the re-election of a director, or the entire board, if the company has experienced material failures in the oversight, management or disclosure of climate risks. We will not support the re-election of a director, or the entire board, if the company has experienced material failures in the oversight, management or disclosure of social risks. We will not support the re-election of a director, or the entire board, if shareholders have experienced unsatisfactory financial performance over time or we lack faith in the ability to implement a sufficiently profitable strategy."}, "3.3": {"heading": "CEO remuneration", "text": "We will not support a remuneration policy or report where the vesting or holding period fails to meet local-market best practice. We will not support a remuneration policy or report where the accelerated vesting arrangement fails to meet local-market best practice. We will not support a remuneration policy or report where we have significant concerns over the structure of the remuneration. We will not support a remuneration policy or report where there is clear misalignment between remuneration and long-term value creation. We will not support a remuneration policy or report if the board received low shareholder support for its most recent pay-related proposal and we consider that the board has failed adequately to address our concern. We will not support a remuneration policy or report where we have significant concerns over one-off payments, including golden hellos, golden parachutes and severance payments. We will not support a remuneration policy or report where the pension arrangements are considered excessive in the local market. We will not support a remuneration policy or report where outcomes could be unusually costly and the incentive structure does not clearly align with shareholders’ interests."}, "4.1": {"heading": "Voting rights", "text": "We will not support the creation of new or additional classes of common stock with unequal voting rights. We will support the abolition of a class of common stock with unequal voting rights on equitable terms. We will not support the introduction of voting caps."}, "4.2": {"heading": "Shareholder meeting", "text": "We will support the right of shareholders to request a general meeting to be called, with a minimum ownership threshold of between 10 and 25 percent. We will support the right of shareholders representing 50 percent of outstanding shares to act by written consent, i.e. act without calling a formal meeting of shareholders. We will support a proposal to de-bundle all agenda items. We will not support a bundled agenda item unless all included items are acceptable."}, "4.3": {"heading": "Governing documents", "text": "We will not support changes to a company’s governing documents if there is a lack of disclosure. We will not support changes to a company’s governing documents that are not in the best interest of shareholders. We will not support changes to a company’s governing documents that are aimed at circumventing a corresponding shareholder proposal."}, "5.1": {"heading": "Auditor", "text": "We will not support the appointment of an auditor if the fees paid to the auditor for non-audit services exceed 50 percent of the total fees paid in two consecutive years. We will not support the appointment of an auditor whose name is not disclosed. We will not support the appointment of an auditor if the previous auditor was replaced without explanation. We will not support the appointment of an auditor, statutory auditor, or audit committee member if there are serious concerns about the external auditor’s ability to identify accounting irregularities."}, "5.2": {"heading": "Financial statements", "text": "We will not support the approval of financial statements if there is insufficient disclosure, or if material weaknesses are flagged by the auditor. We will not support an agenda item if the information disclosed is insufficient to make an informed decision, e.g. the agenda item “other business”."}, "5.3": {"heading": "Sustainability", "text": "We will not support a shareholder proposal that appears to impose a strategy or prescribe detailed methods, unrealistic timeframes or targets for implementation. We will support a proposal that requests reasonable disclosure of the company’s governance, strategy, risk exposures and performance data related to material sustainability risks. We will support a proposal that requests the board to develop and implement a policy or framework where its management of a material sustainability risk appears inadequate. We will not support a proposal that does not address a material sustainability risk or salient issue for the company. We will not support a proposal that is overly prescriptive in regard to the company’s strategy and/or operations, that set unrealistic timeframes and targets or methods for implementation. We will not support a proposal where the company does not appear to have significant gaps in their management or reporting of the relevant sustainability risk. We assess companies against our public expectations on environmental and social issues. We will not support proposals on a company’s climate transition plan (‘Say on Climate’) where the plan does not meet our core expectations on climate change and meet substantive portions of our further guidance on transition plans."}, "6.1": {"heading": "Share issuance", "text": "We will not support a general authority to issue shares with pre-emptive rights if the size of the issuance is considered excessive in relation to currently issued capital. In developed markets, we will not support a general authority to issue shares without pre-emptive rights above 20 percent of currently issued capital. In emerging markets, we will not support a general authority to issue shares without pre-emptive rights above 30 percent of currently issued capital. We will not support a share issuance that does not create long-term value for shareholders or does not treat all shareholders fairly."}, "6.2": {"heading": "Mergers, acquisitions and corporate transactions", "text": "We will not support mergers, acquisitions and other corporate transactions where there is insufficient transparency. We will not support mergers, acquisitions and other corporate transactions that do not treat all shareholders equitably, or where there are conflicts of interest that could negatively affect shareholders. We will not support mergers, acquisitions and other corporate transactions that do not create long-term value for shareholders. We will support a proposal that requires shareholder approval to adopt or amend anti-takeover measures. We will not support the introduction or renewal of anti-takeover measures, such as shareholder rights plans (poison pills), excessive capital authorisations, classified boards, supermajority vote requirements or other control-enhancing mechanisms. We will support a proposal to abolish anti-takeover measures."}, "6.3": {"heading": "Related-party transactions", "text": "We will not support a related-party transaction where the disclosure is insufficient to assess the proposed transaction and its impact on minority shareholders. We will not support a related-party transaction if the transaction is not clearly beneficial to all shareholders."}}, "counts": {"against": 7, "unclear": 8, "with": 1}, "drafted_by": "", "notice": ""}</script><script>// Review sheet. Data comes from sheet.review_sheet as JSON in <script id=data>.
const DATA = JSON.parse(document.getElementById("data").textContent);
const ITEMS = DATA.items, SECTIONS = DATA.sections;
const LANES = {against: "Against the board", unclear: "Unclear", with: "With the board"};
const START = "Our starting point when deciding how to vote is to support the board.";  // verbatim from the guidelines

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const count = lane => ITEMS.filter(r => r.lane === lane).length;
const chevron = '<svg class=chev viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

// Where the proposed vote stands against the board, shown next to an Unclear tag.
function side(r) {
  if (!r.board) return "";
  return r.vote === r.board ? "with" : "against";
}

function section(r) {
  return r.section && SECTIONS[r.section];
}

function basisTitle(r) {
  const s = section(r);
  const title = r.section ? `Global voting guidelines ${r.section}${s ? " " + s.heading : ""}` : "Global voting guidelines";
  return title + (r.section && !r.cited ? ", quote not verified" : "");
}

function basisText(r) {
  const s = section(r);
  return s ? s.text : START;
}

function head() {
  const n = ITEMS.length || 1;
  document.getElementById("split").innerHTML =
    ["against", "with", "unclear"].map(l => `<i class=${l}-c style="width:${count(l) / n * 100}%"></i>`).join("");
  document.getElementById("total").innerHTML = `<strong>${ITEMS.length}</strong><span>proposals</span>`;
  document.getElementById("lanes").innerHTML =
    ["against", "with", "unclear"].map(l =>
      `<div style="width:${count(l) / n * 100}%"><strong>${count(l)}</strong><span><i class="dot ${l}-c"></i>${LANES[l]}</span></div>`).join("");
}

function proposal(r) {
  let tags = `<span class="tag ${r.lane}">${LANES[r.lane]}</span>`;
  if (r.lane === "unclear" && side(r)) tags += `<span class="tag ${side(r)}">${LANES[side(r)]}</span>`;
  if (r.read_first) tags += `<span class="tag first" title="Order only. The proposed vote is unchanged.">Read first</span>`;
  // The applied rule is marked inside the full paragraph, so it is not repeated below.
  const full = basisText(r), inside = r.quote && full.includes(r.quote);
  const text = inside ? esc(full).replace(esc(r.quote), `<strong>${esc(r.quote)}</strong>`) : esc(full);
  let body = `<button class=copy type=button aria-label="Copy context for a language model">${copyIcon}<span>Copy</span></button>
    <p><b>Draft reason:</b> ${esc(r.why)}</p>`;
  body += r.section
    ? `<p><b>Basis:</b> ${esc(basisTitle(r))}</p><div class=para><button class=more type=button>Read more</button><p>${text}</p></div>`
    : `<p><b>Basis:</b> ${r.basis === START ? `Global voting guidelines: “${esc(START)}”` : esc(r.basis || START)}</p>`;
  if (r.quote && !inside) body += `<p><b>Quoted:</b> ${esc(r.quote)}</p>`;
  if (r.evidence) body += `<p><b>From the filing:</b> ${esc(r.evidence)}</p>`;
  if (r.pay) body += `<p><b>Pay facts:</b> ${esc(r.pay)}</p>`;
  if (r.check && r.lane !== "with") body += `<p><b>Check:</b> ${esc(r.check)}</p>`;
  if (r.flags) body += `<p><b>Sent to a person:</b> ${esc(r.flags)}</p>`;
  if (r.rationale && r.lane === "against") {
    const paper = r.paper ? ` <a href="${esc(r.paper[1])}">Position paper: ${esc(r.paper[0])}</a>.` : "";
    body += `<div class=rationale><p><b>Vote rationale:</b> ${esc(r.rationale)}${paper}</p></div>`;
  }
  return `<details class=prop data-lane=${r.lane} data-item="${esc(r.item)}" data-vote="${esc(r.vote)}" data-score="${r.score}"${r.lane === "against" ? " open" : ""}>
    <summary>
      <span class=no>${esc(r.item)}</span>
      <span class=title><strong>${esc(r.text)}</strong><span class=tags>${tags}</span></span>
      <span class=cell><span class=lab>Board</span>${esc(r.board || "Not stated")}</span>
      <span class="cell vote"><span class=lab>Proposed</span>${esc(r.vote)}</span>
      <span class="cell conf"><span class=track><i style="width:${r.score}%"></i></span><span>${r.score}%</span></span>
      <span class=cell><span class=lab>Review</span>${esc(r.review)}</span>
      ${chevron}
    </summary>
    <div class=body>${body}</div>
  </details>`;
}

function context(r) {
  const lines = [
    `${DATA.company}, ${DATA.country}. General meeting ${DATA.meeting_date}.${DATA.notice ? " Not fully read: " + DATA.notice : ""}`,
    `Proposal ${r.item}: ${r.text}`,
    `Board recommends: ${r.board || "Not stated"}`,
    `Proposed vote: ${r.vote} (${LANES[r.lane]})`,
    `Confidence: ${r.score}%`,
    `Review: ${r.review}`,
    `Draft reason: ${r.why}`,
    `Basis: ${r.section ? `${basisTitle(r)}. ${basisText(r)}` : r.basis || START}`,
  ];
  if (r.quote) lines.push(`Rule quoted: ${r.quote}`);
  if (r.evidence) lines.push(`From the filing: ${r.evidence}`);
  if (r.pay) lines.push(`Pay facts: ${r.pay}`);
  if (r.check) lines.push(`Check: ${r.check}`);
  if (r.flags) lines.push(`Sent to a person: ${r.flags}`);
  if (r.rationale) lines.push(`Vote rationale: ${r.rationale}`);
  if (r.paper) lines.push(`Position paper: ${r.paper[0]}, ${r.paper[1]}`);
  return lines.join("\n");
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = Object.assign(document.createElement("textarea"), {value: text});
    document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
}

const ICONS = {
  all: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  unclear: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".6"/>',
  against: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  with: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

function filters() {
  const box = document.getElementById("filters");
  const opts = [["all", "All"], ["unclear", LANES.unclear], ["against", LANES.against], ["with", LANES.with]];
  box.innerHTML = opts.map(([k, t], i) =>
    `<button type=button data-key=${k} aria-pressed=${i === 0}>${icon(k)}<span>${t}</span></button>`).join("");
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.querySelectorAll(".prop").forEach(p => p.hidden = b.dataset.key !== "all" && p.dataset.lane !== b.dataset.key);
  });
}

function actions() {
  document.getElementById("list").addEventListener("click", async e => {
    const more = e.target.closest(".more");
    if (more) {
      const open = more.parentElement.classList.toggle("open");
      more.textContent = open ? "Read less" : "Read more";
      return;
    }
    const btn = e.target.closest(".copy");
    if (btn) {
      const r = ITEMS.find(x => String(x.item) === btn.closest(".prop").dataset.item);
      await copy(context(r));
      btn.querySelector("span").textContent = "Copied";
      setTimeout(() => btn.querySelector("span").textContent = "Copy", 1600);
    }
  });
  const toggle = document.getElementById("toggle");
  toggle.addEventListener("click", () => {
    const open = toggle.textContent === "Open all";
    document.querySelectorAll(".prop:not([hidden])").forEach(p => p.open = open);
    toggle.textContent = open ? "Close all" : "Open all";
  });
}

// A divider only between items on the same line.
function dividers() {
  for (const row of document.querySelectorAll(".info")) {
    let top = null;
    for (const el of row.children) {
      el.classList.remove("start");
      if (top !== null && el.offsetTop > top) el.classList.add("start");
      top = el.offsetTop;
    }
  }
}
addEventListener("resize", dividers);
document.fonts.ready.then(dividers);

head();
dividers();
document.getElementById("list").innerHTML = ITEMS.map(proposal).join("");
filters();
actions();
</script></body></html>
